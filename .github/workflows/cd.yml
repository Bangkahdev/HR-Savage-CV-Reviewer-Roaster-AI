name: CD - Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Build Artifacts
        run: |
          echo "Checking built assets..."
          ls -la dist/
          echo "Server bundle size:"
          du -sh dist/server.cjs

      - name: Ready for Container / Server Deployment
        run: |
          echo "🚀 Deployment package successfully generated in dist/"
          echo "✅ Ready for production execution via: node dist/server.cjs"
