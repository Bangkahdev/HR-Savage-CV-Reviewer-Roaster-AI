name: CI - Lint, Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    name: Code Quality & Build Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --include=optional

      - name: Type Check & Linting
        run: npm run lint

      - name: Production Build Check
        run: npm run build

      - name: Verify Distribution Output
        run: |
          test -d dist || { echo "❌ dist folder not found!"; exit 1; }
          test -f dist/index.html || { echo "❌ dist/index.html not found!"; exit 1; }
          test -f dist/server.cjs || { echo "❌ dist/server.cjs not found!"; exit 1; }
          echo "✅ Production artifacts verified successfully!"
